            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);

            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        /* Master Scene Wrapper */
        .luxury-scene {
            position: relative;
            width: 380px;
            height: 420px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* --- BUILDER ILLUSTRATION CONTAINER --- */
        .builder-illustration {
            position: relative;
            width: 260px;
            height: 360px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* Ambient Glow Backdrop */
        .glow-backdrop {
            position: absolute;
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            top: 10px;
            z-index: 0;
        }

        /* --- TORSO & HEAVY-DUTY ATTIRE --- */
        .torso-group {
            position: absolute;
            bottom: 0;
            width: 260px;
            height: 190px;
            z-index: 1;
        }

        .safety-vest {
            position: absolute;
            bottom: 0;
            left: 15px;
            width: 230px;
            height: 150px;
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            border-radius: 120px 120px 0 0;
            box-shadow: inset 0 10px 20px rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(251, 191, 36, 0.5);
        }

        /* Reflective Vest Stripes */
        .stripe-left {
            position: absolute;
            top: 20px;
            left: 55px;
            width: 25px;
            height: 130px;
            background: #f8fafc;
            opacity: 0.9;
            transform: skewX(-10deg);
        }

        .stripe-right {
            position: absolute;
            top: 20px;
            right: 55px;
            width: 25px;
            height: 130px;
            background: #f8fafc;
            opacity: 0.9;
            transform: skewX(10deg);
        }

        .work-shirt {
            position: absolute;
            bottom: 0;
            left: 25px;
            width: 210px;
            height: 120px;
            background: linear-gradient(to bottom, #334155, #1e293b);
            border-radius: 90px 90px 0 0;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.2);
        }

            position: absolute;

            left: 75px;
            width: 60px;
            height: 50px;
            background: #0f172a;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
        }

        .hammer-group {
            position: absolute;
            bottom: 40px;
            right: -15px;
            width: 50px;
            height: 140px;
            transform: rotate(-25deg);
            z-index: 5;
        }

        .hammer-handle {
            position: absolute;
            bottom: 0;
            left: 20px;
            width: 12px;
            height: 110px;

            box-shadow: 2px 4px 6px rgba(0,0,0,0.4);
        }

            position: absolute;
            top: 0;
            left: 2px;
            width: 48px;
            height: 22px;
            background: linear-gradient(135deg, #cbd5e1, #475569);
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .neck {
            position: absolute;
            bottom: 120px;
            left: 115px;
            width: 40px;
            height: 60px;
            background: linear-gradient(to right, #d97706, #b45309, #92400e);
            z-index: 2;
            border-radius: 10px;
        }

        .head-group {
            position: absolute;
            bottom: 150px;
            left: 75px;
            width: 120px;
            height: 150px;
            z-index: 3;
        }

        .ear-left {
            position: absolute;
            top: 60px;
            left: -5px;
            width: 18px;
            height: 28px;
            background: #b45309;
            border-radius: 50% 0 0 50%;
        }

        .ear-right {
            position: absolute;
            top: 60px;
            right: -5px;
            width: 18px;
            height: 28px;
            background: #92400e;
            border-radius: 0 50% 50% 0;
        }

        .face {
            position: absolute;
            top: 25px;
            left: 15px;
            width: 90px;
            height: 110px;
            background: linear-gradient(145deg, #fcd34d, #f59e0b);
            border-radius: 45px 45px 50px 50px;
            box-shadow: inset 0 -10px 15px rgba(0,0,0,0.1);
        }

        /* --- HARD HAT --- */
        .hard-hat {
            position: absolute;
            top: -15px;
            left: 0px;
            width: 120px;
            height: 50px;
            background: linear-gradient(135deg, #fbbf24, #d97706);
            border-radius: 60px 60px 10px 10px;
            z-index: 6;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .hat-brim {
            position: absolute;
            top: 25px;
            left: -10px;
            width: 140px;
            height: 12px;
            background: #f59e0b;
            border-radius: 6px;
            z-index: 7;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .safety-glasses {
            position: absolute;
            top: 60px;
            left: 18px;
            width: 84px;
            height: 24px;
            background: rgba(56, 189, 248, 0.25);
            border: 2px solid #0284c7;
            border-radius: 12px;
            z-index: 6;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.6);
        }

        .confident-smile {
            position: absolute;
            bottom: 22px;
            left: 38px;
            width: 20px;
            height: 8px;
            border-bottom: 2.5px solid #78350f;
            border-radius: 0 0 10px 10px;
        }
    </style>
</head>

                <div class="safety-vest">

                    <div class="stripe-right"></div>
                </div>
                <div class="work-shirt">

            </div>

            <!-- Hammer Graphic -->
